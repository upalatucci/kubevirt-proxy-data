openapi: 3.0.3
info:
  title: KubeVirt API server proxy
  description: |
    HTTP API for the kubevirt-apiserver-proxy sidecar used by the KubeVirt UI.

    This specification documents endpoints implemented by the proxy itself.
    `GET /api/{apiPath}` forwards core Kubernetes API requests (`/api/v1/...`).
    `GET /apis/{apiPath}` forwards named API group requests (`/apis/{group}/v1/...`).
    Request and response bodies follow upstream API schemas (see the Kubernetes API reference). The proxy
    may add `totalItems` and filter `items` when query parameters are present on list
    responses.
  version: 0.0.10

security:
  - bearerAuth: []

servers:
  - url: http://localhost:8080
    description: Local development (`APP_ENV=dev`, plain HTTP)
  - url: https://localhost:8080
    description: Production pod (TLS on port 8080)

paths:
  /health:
    get:
      summary: Liveness and TLS readiness
      description: |
        Reports process status and whether required TLS material is available.

        Returns `200` when `ready` is true (serving certificate and key are present
        when TLS is required). Returns `503` when the process is running but not
        ready to serve HTTPS in production mode.

        Responses may be cached for 30 seconds (by request URI).
      operationId: getHealth
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Proxy is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                ready: true
                appEnv: dev
                kubeAPIServer: kubernetes.default.svc
                servingTLS:
                  required: false
                  certPath: ./cert/tls.crt
                  keyPath: ./cert/tls.key
                  certLoaded: false
                  keyLoaded: false
                kubernetes:
                  serviceAccountCAPath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  serviceAccountCAPresent: true
                  serviceAccountCAValid: true
        "503":
          description: Proxy is alive but not ready (missing serving TLS material in production mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /apis/allowednamespaces:
    post:
      summary: Namespaces allowed for a Kubernetes action
      description: |
        Lists cluster namespaces where the caller may perform the action described in
        `resourceAttributes`, using SelfSubjectAccessReview (SSAR) against the API server.
        The caller's `Authorization` header is required and forwarded for each review.

        Optional `maxConcurrency` in the request body limits parallel SSAR checks (positive
        integer, capped by server configuration). When omitted, the server default applies.

        Optional `resourceAttributes.cluster` targets a managed cluster via ACM cluster-proxy
        (same semantics as the `/cluster/{name}/` path prefix on `GET /api/*` and `GET /apis/*`).
        When omitted or equal to the ACM hub cluster name (`localHubName` from console `GET /hub`),
        the hub API server (`KUBE_API_SERVER`) is used. The `cluster` field is not sent to Kubernetes SSAR.

        Successful responses may be cached for 2 minutes (keyed by auth headers and
        request body). Responses that include `failures` are not cached.
      operationId: postAllowedNamespaces
      tags:
        - Operations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowedNamespacesRequest"
            example:
              resourceAttributes:
                verb: get
                group: kubevirt.io
                resource: virtualmachines
      responses:
        "200":
          description: Allowed namespaces (possibly with per-namespace SSAR failures)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedNamespacesResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Authorization header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to reach the Kubernetes API server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/{apiPath}:
    get:
      summary: Kubernetes core API proxy (GET)
      description: |
        Forwards **core** API requests (`/api/v1/...`, for example PersistentVolumeClaims,
        Pods, Secrets). Optional multicluster prefix: `/api/cluster/{clusterName}/v1/...`.
        Same routing, auth, caching, and optional list filtering as `GET /apis/{apiPath}`.
      operationId: proxyKubernetesCoreGet
      tags:
        - Kubernetes proxy
      security:
        - bearerAuth: []
      parameters:
        - name: apiPath
          in: path
          required: true
          description: |
            Path after `/api/`, for example `v1/namespaces/default/persistentvolumeclaims` or
            `cluster/bm07/v1/namespaces/default/persistentvolumeclaims`.
          schema:
            type: string
      responses:
        "200":
          description: Upstream success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxiedListResponse"
        "400":
          description: Invalid proxy path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Upstream unauthorized
        "403":
          description: Upstream forbidden
        "404":
          description: Upstream not found
        "500":
          description: Proxy failed to reach the API server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Upstream status code and body are passed through when possible

  /apis/{apiPath}:
    get:
      summary: Kubernetes API proxy (GET)
      description: |
        Forwards **named API group** requests. The path after `/apis/` must start with
        an API group and version (`{group}/{version}/...`), for example
        `kubevirt.io/v1/namespaces/default/virtualmachines`. Core resources belong on
        `GET /api/{apiPath}` instead (`/api/v1/...`). Requests like `/apis/v1/...`
        without a group are rejected with `400`.

        Forwards the request to the hub Kubernetes API server (`KUBE_API_SERVER`, default
        `kubernetes.default.svc`) or, when the path includes `/apis/cluster/{clusterName}/`,
        to the ACM cluster-proxy addon (`CLUSTER_PROXY_ADDON_HOST`:`CLUSTER_PROXY_ADDON_PORT`,
        default `cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092`).
        Omit the `/cluster/{name}/` segment for hub traffic. Set `CLUSTER_PROXY_ENABLED=false`
        to always use the hub API server. The caller's `Authorization` header is passed through.
        WebSocket upgrades use the same routing with impersonation metadata in subprotocols when applicable.

        **List filtering:** If the client sends query parameters and the upstream response
        is a Kubernetes list (`items` array), the proxy may filter `items` server-side.
        The legacy routing query parameter `cluster` is stripped before filtering so it
        does not empty list responses. The JSON body includes `totalItems` (upstream list
        length) and `items` (filtered when other query parameters are present). Filter keys
        are JSON paths (for example `status.printableStatus=Error` for VirtualMachine error
        states).

        Hub cluster name discovery uses the pod service account when available (`GET /hub`
        and ManagedCluster list).

        Responses may be cached for 15 seconds (request URI, query string, bearer
        token, and impersonation headers).
      operationId: proxyKubernetesGet
      tags:
        - Kubernetes proxy
      security:
        - bearerAuth: []
      parameters:
        - name: apiPath
          in: path
          required: true
          description: |
            Kubernetes API path after `/apis/`, for example
            `kubevirt.io/v1/namespaces/default/virtualmachines` or
            `cluster/bm07/kubevirt.io/v1/namespaces/default/virtualmachines`.
          schema:
            type: string
          examples:
            virtualMachineList:
              value: kubevirt.io/v1/namespaces/default/virtualmachines
      responses:
        "200":
          description: Upstream success (body shape depends on the Kubernetes resource)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxiedListResponse"
        "401":
          description: Upstream unauthorized
        "403":
          description: Upstream forbidden
        "404":
          description: Upstream not found
        "400":
          description: Invalid proxy path (for example `/apis/v1/...` without an API group)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Proxy failed to reach the API server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Upstream status code and body are passed through when possible

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token forwarded to the Kubernetes API server

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - ready
        - appEnv
        - kubeAPIServer
        - servingTLS
        - kubernetes
      properties:
        status:
          type: string
          description: Always `ok` when the handler responds
          example: ok
        ready:
          type: boolean
          description: |
            False when production mode requires serving TLS files and either
            certificate or key is missing
        appEnv:
          type: string
          description: Value of `APP_ENV` (empty when unset; `dev` disables serving TLS requirement)
          example: dev
        kubeAPIServer:
          type: string
          description: API server host from `KUBE_API_SERVER`
          example: kubernetes.default.svc
        servingTLS:
          $ref: "#/components/schemas/ServingTLSHealth"
        kubernetes:
          $ref: "#/components/schemas/KubernetesHealth"

    ServingTLSHealth:
      type: object
      required:
        - required
        - certPath
        - keyPath
        - certLoaded
        - keyLoaded
      properties:
        required:
          type: boolean
          description: True when `APP_ENV` is not `dev`
        certPath:
          type: string
          description: Path checked for the serving certificate (`SERVING_TLS_CERT_PATH` or default)
        keyPath:
          type: string
          description: Path checked for the serving private key (`SERVING_TLS_KEY_PATH` or default)
        certLoaded:
          type: boolean
        keyLoaded:
          type: boolean

    KubernetesHealth:
      type: object
      required:
        - serviceAccountCAPath
        - serviceAccountCAPresent
        - serviceAccountCAValid
      properties:
        serviceAccountCAPath:
          type: string
          description: Path to the in-cluster service account CA bundle
        serviceAccountCAPresent:
          type: boolean
        serviceAccountCAValid:
          type: boolean
          description: True when the file exists and contains parseable PEM certificates

    ProxiedListResponse:
      type: object
      description: |
        Typical list response after proxying. Additional fields from the upstream API
        are preserved. When query filters are applied, `items` may be a subset of the
        upstream list.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          additionalProperties: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        totalItems:
          type: integer
          description: Number of items in the upstream list before filtering
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AllowedNamespacesRequest:
      type: object
      required:
        - resourceAttributes
      properties:
        resourceAttributes:
          $ref: "#/components/schemas/ResourceAttributes"
        maxConcurrency:
          type: integer
          minimum: 1
          description: |
            Maximum parallel SSAR checks (server-capped). When omitted, the default from
            `ALLOWED_NS_MAX_CONCURRENCY` applies.

    AllowedNamespacesResponse:
      type: object
      required:
        - allowedNamespaces
      properties:
        allowedNamespaces:
          type: array
          items:
            type: string
          description: Namespaces where SSAR allowed the requested action
        failures:
          type: array
          items:
            $ref: "#/components/schemas/NamespaceFailure"
          description: Per-namespace SSAR errors (omitted when empty)

    NamespaceFailure:
      type: object
      required:
        - namespace
        - error
      properties:
        namespace:
          type: string
        error:
          type: string

    ResourceAttributes:
      type: object
      required:
        - verb
      properties:
        cluster:
          type: string
          description: |
            Managed cluster for namespace discovery and SSAR routing. Same semantics as the
            `/cluster/{name}/` path prefix on `GET /api/*` and `GET /apis/*`. Omitted or equal
            to ACM `localHubName` for the hub API server.
        namespace:
          type: string
        verb:
          type: string
          description: Kubernetes verb (for example `get`, `list`, `create`)
        group:
          type: string
        version:
          type: string
        resource:
          type: string
        subresource:
          type: string
        name:
          type: string

tags:
  - name: Operations
    description: Proxy-owned endpoints
  - name: Kubernetes proxy
    description: Pass-through to the cluster API server
